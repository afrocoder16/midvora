name: Deploy root site to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-hostinger.yml"
  workflow_dispatch:
    inputs:
      clean_slate:
        description: "Wipe public_html before uploading (use once to clear stray/leftover files)"
        type: boolean
        default: false
      diagnose_ftp:
        description: "List the FTP account's directory layout instead of deploying (troubleshooting only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build Astro site and upload to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Diagnose FTP directory layout
        if: github.event.inputs.diagnose_ftp == 'true'
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.CPANEL_FTP_SERVER_DIR }}
        run: |
          set +e
          echo "=== login banner / real home directory (PWD reply) ==="
          curl -s -v --list-only "ftp://$FTP_SERVER:$FTP_PORT/" --user "$FTP_USERNAME:$FTP_PASSWORD" 2>&1 | grep -E "^< 2(2[07]|57)"

          try() {
            echo "=== $1 ==="
            curl -s --list-only "ftp://$FTP_SERVER:$FTP_PORT/$1" --user "$FTP_USERNAME:$FTP_PASSWORD"
            code=$?
            if [ $code -ne 0 ]; then echo "(curl exit $code - not accessible from here)"; fi
          }

          try ""
          try "$FTP_SERVER_DIR"
          try "../"
          try "../../"
          try "domains/"
          try "domains/midvora.com/"
          try "domains/midvora.com/public_html/"
          try "public_html/domains/"
          try "public_html/domains/midvora.com/public_html/"
          echo "=== done ==="

      - name: Checkout repository
        if: github.event.inputs.diagnose_ftp != 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: github.event.inputs.diagnose_ftp != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: github.event.inputs.diagnose_ftp != 'true'
        run: npm ci

      - name: Build Astro site
        if: github.event.inputs.diagnose_ftp != 'true'
        run: npm run build

      - name: Verify build output
        if: github.event.inputs.diagnose_ftp != 'true'
        run: test -f dist/index.html

      - name: Upload dist to Hostinger over FTP
        if: github.event.inputs.diagnose_ftp != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          port: ${{ secrets.CPANEL_FTP_PORT }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: ${{ secrets.CPANEL_FTP_SERVER_DIR }}
          dangerous-clean-slate: ${{ github.event.inputs.clean_slate == 'true' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
